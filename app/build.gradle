plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'app.bookscan'
    compileSdk 35
    defaultConfig {
        applicationId 'app.bookscan'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }
    buildFeatures {
        buildConfig true
    }
    def updateKeystore = providers.environmentVariable('BOOKSCAN_KEYSTORE').orNull
    if (updateKeystore != null) {
        signingConfigs {
            updates {
                storeFile file(updateKeystore)
                storePassword providers.environmentVariable('BOOKSCAN_STORE_PASSWORD').get()
                keyAlias providers.environmentVariable('BOOKSCAN_KEY_ALIAS').get()
                keyPassword providers.environmentVariable('BOOKSCAN_KEY_PASSWORD').get()
            }
        }
        buildTypes.release.signingConfig = signingConfigs.updates
    }
}
dependencies {
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
}
